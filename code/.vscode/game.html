<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speak Up! - Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: white;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    
    .game-container {
      background: white;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      border: 2px solid black;
    }
    
    .team-display {
      font-size: 36px;
      font-weight: bold;
      color: #03a83d;
      margin: 20px 0;
    }
    
    .timer {
      font-size: 48px;
      font-weight: bold;
      color: #ff0000;
      margin: 20px 0;
      padding: 20px;
      border: 3px solid black;
    }
    
    .prompt {
      font-size: 18px;
      margin: 20px 0;
      padding: 15px;
      background: #f0f0f0;
      border: 1px solid black;
    }
    
    .controls {
      margin-top: 20px;
    }
    
    button {
      padding: 15px 30px;
      margin: 10px;
      border: 2px solid black;
      font-size: 16px;
      cursor: pointer;
    }
    
    .next-team-btn {
      background: #03a83d;
      color: white;
    }
    
    .next-team-btn:hover {
      background: #028a33;
    }
    
    .next-team-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .back-btn {
      background: #666;
      color: white;
    }
    
    .back-btn:hover {
      background: #555;
    }
    
    .recording-indicator {
      display: none;
      color: #ff0000;
      font-weight: bold;
      margin: 15px 0;
    }
    
    .recording-indicator.active {
      display: block;
    }
    
    .loading-indicator {
      color: #03a83d;
      font-weight: bold;
      margin: 15px 0;
    }
    
    .loading-indicator.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="team-display" id="currentTeam">Team 1</div>
    
    <div class="timer" id="timer">2:00</div>
    
    <div class="recording-indicator" id="recordingIndicator">Recording...</div>
    
    <div class="loading-indicator" id="loadingIndicator">Generating prompts...</div>
    
    <div class="prompt" id="prompt">
      Your prompt will appear here. This is a sample prompt for demonstration.
    </div>
    
    <div class="controls">
      <button class="next-team-btn" id="nextTeamBtn" disabled>Next Team</button>
      <button class="back-btn" id="backBtn">Back to Setup</button>
    </div>
  </div>

  <script>
    // game state
    let gameData = null;
    let currentTeamIndex = 0;
    let timeRemaining = 0;
    let timerInterval = null;
    let isRecording = false;
    let teamPrompts = []; // store generated prompts for each team
    let mediaRecorder = null;
    let audioChunks = [];
    let teamScores = []; // store scores for each team
    let isProcessingAudio = false; // flag to track if audio is being processed

    // initialize game when page loads
    window.addEventListener('load', async function() {
      // load game data from localStorage
      const savedData = localStorage.getItem('gameData');
      if (!savedData) {
        alert('No game data found. Returning to setup.');
        window.location.href = 'home.html';
        return;
      }
      
      gameData = JSON.parse(savedData);
      timeRemaining = gameData.timePerTeam + 5; // add 5 seconds to selected time
      
      // generate prompts for all teams
      await generateAllPrompts(); 
      updateDisplay();
      startTimer();
    });

    function updateDisplay() {
      // update team display
      document.getElementById('currentTeam').textContent = `Team ${currentTeamIndex + 1}`;
      
      // update prompt from generated prompts
      if (teamPrompts[currentTeamIndex]) {
        document.getElementById('prompt').textContent = teamPrompts[currentTeamIndex];
      } else {
        document.getElementById('prompt').textContent = 'Generating prompt...';
      }
      
      // update timer display
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      document.getElementById('timer').textContent = 
        `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }

    // chatgpt API integration
    async function generatePrompt(gameMode, teamNumber) {
      const apiKey = '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'; // Replace with your actual API key
      
      const promptTemplates = {
        'debate': `Generate a completely different and original one-sentence debate or convincing topic in a party game. The goal is to argue for a side or convince the audience of an idea. Make it controversial but fun. DO NOT use common debate topics, avoid pizza and teleportation. DO NOT repeat previous topics. Be creative and unexpected. YOU choose the side. Examples: "Argue that robots should replace teachers" or "Argue that weekends should be 4 days long" or "Convince us why penguins should rule the world".`,
        'story': `Generate a completely different one-sentence storytelling prompt for a party game. Include 2-3 random objects. DO NOT repeat objects. Ensure it is different and original from previous topics. Examples: "Tell a story that includes a magic lamp and a talking cat" or "Create a story about a rubber duck and a spaceship".`,
        'problem': `Generate a one-sentence problem-solving scenario for a party game. Make it absurd but entertaining and keep it simple. Ensure it is different and original from previous topics. Examples: "You are lost in space with only a rubber duck - explain how you will survive" or "Convince aliens that Earth is worth saving using only emojis".`,
        'tedx': `Generate a 1-2 sentence TEDx-style speaking prompt for a party game. Make it motivational or explanatory but keep it simple. Ensure it is different and original from previous topics. Examples: “The power of failing.” or “Why creativity matters more than intelligence.” or “How technology shapes human connection.”`,
      };

      const systemPrompt = promptTemplates[gameMode] || promptTemplates['random'];

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'gpt-3.5-turbo',
            messages: [
              { role: 'system', content: 'You are a creative party game prompt generator. Generate engaging, fun speaking prompts for teams.' },
              { role: 'user', content: systemPrompt }
            ],
            max_tokens: 180,
            temperature: 1.2
          })
        });

        if (!response.ok) {
          throw new Error(`API request failed: ${response.status}`);
        }

        const data = await response.json();
        return data.choices[0].message.content.trim();
      } catch (error) {
        console.error('Error generating prompt:', error);
        // fallback prompts if API fails
        const fallbackPrompts = {
          'debate': `Argue for or against: Team ${teamNumber} is the best team in the game.`,
          'story': `Tell a story about Team ${teamNumber}'s greatest adventure.`,
          'problem': `Team ${teamNumber} is stuck on a desert island with only a rubber duck. How will you survive?`,
          'tedx': `Team ${teamNumber}, what motivates you?`,
        };
        return fallbackPrompts[gameMode] || fallbackPrompts['random'];
      }
    }

    async function generateAllPrompts() {
      // show loading state
      document.getElementById('loadingIndicator').classList.add('active');
      document.getElementById('prompt').textContent = 'Generating prompts for all teams...';
      
      try {
        // generate prompts for all teams
        const promptPromises = [];
        for (let i = 0; i < gameData.teams; i++) {
          promptPromises.push(generatePrompt(gameData.gameMode, i + 1));
        }
        
        teamPrompts = await Promise.all(promptPromises);
        console.log('Generated prompts:', teamPrompts);
        
        // hide loading indicator
        document.getElementById('loadingIndicator').classList.remove('active');
      } catch (error) {
        console.error('Error generating prompts:', error);
        document.getElementById('loadingIndicator').classList.remove('active');
        alert('Failed to generate prompts. Using fallback prompts.');
      }
    }

    async function startTimer() {
      // start recording indicator
      document.getElementById('recordingIndicator').classList.add('active');
      isRecording = true;
      
      // start audio recording
      await startRecording();
      
      // start countdown
      timerInterval = setInterval(function() {
        timeRemaining--;
        updateTimerDisplay();
        
        if (timeRemaining <= 0) {
          stopTimer();
        }
      }, 1000);
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        
        // Store the current team info when recording starts
        const currentTeam = currentTeamIndex;
        const currentPrompt = teamPrompts[currentTeamIndex];
        
        mediaRecorder.ondataavailable = (event) => {
          audioChunks.push(event.data);
        };
        
        mediaRecorder.onstop = async () => {
          // stop all tracks
          stream.getTracks().forEach(track => track.stop());
          
          // process the audio with the stored team info
          await processAudioAndScore(currentTeam, currentPrompt);
        };
        
        mediaRecorder.start();
      } catch (error) {
        console.error('Error starting recording:', error);
        alert('Could not start audio recording. Please enable microphone permissions.');
      }
    }

    async function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById('recordingIndicator').classList.remove('active');
      isRecording = false;
      
      // stop recording
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      
      document.getElementById('nextTeamBtn').disabled = false;
    }

    async function processAudioAndScore(teamIndex, prompt) {
      isProcessingAudio = true;
      try {
        // show scoring indicator
        document.getElementById('loadingIndicator').classList.add('active');
        document.getElementById('loadingIndicator').textContent = 'Scoring team performance...';
        
        // convert audio chunks to blob
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        
        // transcribe audio
        const transcript = await transcribeAudio(audioBlob);
        
        // score the transcript (now returns {score, feedback})
        const result = await scoreTranscript(transcript, prompt, gameData.gameMode);
        
        // store score with feedback using the captured team info
        teamScores.push({
          teamNumber: teamIndex + 1,
          score: result.score,
          feedback: result.feedback,
          transcript: transcript,
          prompt: prompt
        });
        
        console.log(`Team ${teamIndex + 1} scored ${result.score}/100`);
        
        // hide scoring indicator
        document.getElementById('loadingIndicator').classList.remove('active');
        document.getElementById('loadingIndicator').textContent = 'Generating prompts...';
      } catch (error) {
        console.error('Error processing audio:', error);
        document.getElementById('loadingIndicator').classList.remove('active');
        
        // store a default score if processing fails
        teamScores.push({
          teamNumber: teamIndex + 1,
          score: 0,
          feedback: 'Unable to process audio feedback.',
          transcript: 'Error processing audio',
          prompt: prompt
        });
      } finally {
        isProcessingAudio = false;
      }
    }

    async function transcribeAudio(audioBlob) {
      const apiKey = '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';
      
      const formData = new FormData();
      formData.append('file', audioBlob, 'recording.webm');
      formData.append('model', 'whisper-1');
      formData.append('language', 'en');
      
      try {
        const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`
          },
          body: formData
        });
        
        if (!response.ok) {
          throw new Error(`Transcription failed: ${response.status}`);
        }
        
        const data = await response.json();
        return data.text;
      } catch (error) {
        console.error('Error transcribing audio:', error);
        return 'Transcript unavailable due to processing error.';
      }
    }

    async function scoreTranscript(transcript, prompt, gameMode) {
      const apiKey = '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';
      
      const scoringCriteria = {
        'debate': 'Evaluate persuasiveness, logical arguments, and convincing presentation.',
        'story': 'Evaluate creativity, narrative structure, and storytelling quality.',
        'problem': 'Evaluate problem-solving approach, originality, and practicality.',
        'tedx': 'Evaluate clarity, engagement, and motivational impact.'
      };
      
      // First, get the score
      const scoringPrompt = `You are an expert judge for a speaking competition. Evaluate the following transcript based on:
1. Content Quality (25 points): Relevance to the prompt and depth of ideas
2. Creativity & Originality (25 points): Unique perspective and innovative thinking
3. Structure & Clarity (20 points): Organization, coherence, and clear communication
4. Speaking Quality (20 points): Minimize filler words, maintain engaging pace
5. Overall Impact (10 points): How memorable and impactful the presentation was

${scoringCriteria[gameMode] || 'Evaluate overall quality and engagement.'}

Prompt given: "${prompt}"
Transcript: "${transcript}"

Provide ONLY a number from 0-100 as your final score. Do not include any explanation, just the number.`;

      try {
        // Get the score
        const scoreResponse = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'gpt-3.5-turbo',
            messages: [
              { role: 'system', content: 'You are a fair and objective judge for speaking competitions.' },
              { role: 'user', content: scoringPrompt }
            ],
            max_tokens: 10,
            temperature: 0.5
          })
        });
        
        if (!scoreResponse.ok) {
          throw new Error(`Scoring failed: ${scoreResponse.status}`);
        }
        
        const scoreData = await scoreResponse.json();
        const scoreText = scoreData.choices[0].message.content.trim();
        const scoreMatch = scoreText.match(/\d+/);
        const score = scoreMatch ? parseInt(scoreMatch[0]) : 50;
        const finalScore = Math.max(0, Math.min(100, score));
        
        // Now get detailed feedback
        const feedbackPrompt = `As an expert judge, provide brief but specific feedback (2-3 sentences) explaining why this speaking performance received a score of ${finalScore}/100. Be constructive and encouraging. Focus on the most important strengths and one area for improvement.

Prompt given: "${prompt}"
Transcript: "${transcript}"
Score: ${finalScore}/100`;

        const feedbackResponse = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'gpt-3.5-turbo',
            messages: [
              { role: 'system', content: 'You are a supportive and constructive judge for speaking competitions.' },
              { role: 'user', content: feedbackPrompt }
            ],
            max_tokens: 150,
            temperature: 0.7
          })
        });
        
        if (!feedbackResponse.ok) {
          throw new Error(`Feedback generation failed: ${feedbackResponse.status}`);
        }
        
        const feedbackData = await feedbackResponse.json();
        const feedback = feedbackData.choices[0].message.content.trim();
        
        return { score: finalScore, feedback: feedback };
      } catch (error) {
        console.error('Error scoring transcript:', error);
        return { score: 50, feedback: 'Unable to generate detailed feedback at this time.' };
      }
    }

    // event listeners
    document.getElementById('nextTeamBtn').addEventListener('click', async function() {
      if (currentTeamIndex < gameData.teams - 1) {
        // move to next team
        currentTeamIndex++;
        timeRemaining = gameData.timePerTeam + 5;
        document.getElementById('nextTeamBtn').disabled = true;
        updateDisplay();
        startTimer();
      } else {
        // all teams done, wait for audio processing if needed
        const maxWaitTime = 30000; // 30 seconds max wait
        const startTime = Date.now();
        
        while (isProcessingAudio && (Date.now() - startTime) < maxWaitTime) {
          await new Promise(resolve => setTimeout(resolve, 100)); // wait 100ms
        }
        
        // save scores and go to results
        localStorage.setItem('teamScores', JSON.stringify(teamScores));
        alert('All teams have completed their turns!');
        // navigate to results page
        window.location.href = 'results.html';
      }
    });

    document.getElementById('backBtn').addEventListener('click', function() {
      if (confirm('Are you sure you want to go back? This will end the current game.')) {
        window.location.href = 'home.html';
      }
    });
  </script>
</body>
</html>
