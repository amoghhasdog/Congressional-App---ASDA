<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speak Up!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgb(164, 255, 164);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    label {
      font-weight: bold;
      margin-bottom: 0.5rem;
      display: block;
    }
    input, select, button {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 1px;
      border: 1px solid #00e893;
      font-size: 1rem;
    }
    button {
      background: #03a83d;
      color: rgb(1, 56, 1);
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #ebedf3;
    }
  </style>
</head>
<body>
<div id="setup-screen" class="card">
  <h1>Speak Up!</h1>

    <label for="teams">Number of Teams</label>
    <input type="number" id="teams" min="1" value="2">

    <label for="time">Time per Team (seconds)</label>
    <input type="number" id="time" min="10" value="60">

   
    <label for="mode">Game Mode</label>
    <select id="mode">
      <option value="debate">That's Debatable</option>
      <option value="story">Storytelling</option>
      <option value="problem">Problem Solving</option>
      <option value="tedx">TEDx</option>
    </select>

    <button id="startGame">Start Game</button>
  </div>

  <script>
    document.getElementById('startGame').addEventListener('click', function() {
      // get data from form
      const gameData = {
        teams: parseInt(document.getElementById('teams').value),
        timePerTeam: parseInt(document.getElementById('time').value),
        gameMode: document.getElementById('mode').value
      };
      
      // store data for next screen
      localStorage.setItem('gameData', JSON.stringify(gameData));
      
      // navigate to game screen
      window.location.href = 'game.html';
    });
  </script>
</body>
</html>
