<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Game Setup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(255, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    label {
      font-weight: bold;
      margin-bottom: 0.5rem;
      display: block;
    }
    input, select, button {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 1px;
      border: 1px solid #00e893;
      font-size: 1rem;
    }
    button {
      background: #03a83d;
      color: rgb(1, 56, 1);
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #ebedf3;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Party Game Setup</h1>

    <label for="teams">Number of Teams</label>
    <input type="number" id="teams" min="1" value="2">

    <label for="time">Time per Team (mins)</label>
    <input type="number" id="time" min="1" value="2">

    <label for="mode">Game Mode</label>
    <select id="mode">
      <option value="random">Random Fun Topics</option>
      <option value="debate">Debate</option>
      <option value="story">Storytelling</option>
      <option value="problem">Problem Solving</option>
      <option value="cycle">Cycle Through All</option>
    </select>

    <button>Start Game</button>
  </div>
</body>
</html>
