<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speak Up!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgb(164, 255, 164);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    label {
      font-weight: bold;
      margin-bottom: 0.5rem;
      display: block;
    }
    input, select, button {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 1px;
      border: 1px solid #00e893;
      font-size: 1rem;
    }
    button {
      background: #03a83d;
      color: rgb(1, 56, 1);
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #ebedf3;
    }
  </style>
</head>
<body>
<div id="setup-screen" class="card">
  <h1>Speak Up!</h1>

    <label for="teams">Number of Teams</label>
    <input type="number" id="teams" min="1" value="2">

    
    <input type="number" id="time" min="1" value="2">
    <label for="time">Time per Team (mins)</label>

   
    <label for="mode">Game Mode</label>
    <select id="mode">
      <option value="Random fun topics!">Random Fun Topics</option>
      <option value="Debate!">Debate</option>
      <option value="Storytelling!">Storytelling</option>
      <option value="Problem solving!">Problem Solving</option>
      <option value="Cycle through all!">Cycle Through All</option>
    </select>

    <button id="startBtn">Start Game</button>
  </div>

  
  <div id="game-screen" class="card" style="display:none;">
    <h1>Game Screen</h1>
    <p id="game-info"></p>
    <button id="backBtn">Go Back</button>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const backBtn = document.getElementById("backBtn");
    const setupScreen = document.getElementById("setup-screen");
    const gameScreen = document.getElementById("game-screen");
    const gameInfo = document.getElementById("game-info");

    startBtn.addEventListener("click", () => {
      
    
      const teams = document.getElementById("teams").value;
      const time = document.getElementById("time").value;
      const mode = document.getElementById("mode").value;
      

     
      gameInfo.textContent = `Game started with ${teams} teams, ${time} minutes each, and the mode is: ${mode}`;

    
      setupScreen.style.display="none";
      gameScreen.style.display = "block";
    });

    backBtn.addEventListener("click", () => {
      
      setupScreen.style.display = "block";
      gameScreen.style.display = "none";

      
    });
  </script>
</body>
</html>
